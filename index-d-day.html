anel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:19px}.panel-title{font-weight:800;font-size:17px;letter-spacing:-.4px}.panel-title small{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}.search{width:210px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fcfcfe}.search:focus,input:focus,select:focus,textarea:focus{border-color:#b4a8fa;box-shadow:0 0 0 3px #7157e814}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{border:0;background:transparent;padding:8px 12px;border-radius:9px;color:#82869a;font-size:12px;font-weight:700}.tab.active{color:var(--purple);background:var(--purple2)}.sort{border:1px solid var(--line);color:#6f7388;background:white;border-radius:9px;padding:8px 10px;font-size:12px;outline:none}.events{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.event{border:1px solid var(--line);border-radius:15px;padding:16px;position:relative;transition:.18s;background:white;min-width:0}.event:hover{border-color:#d4cdfb;transform:translateY(-2px);box-shadow:0 9px 20px #2528490c}.event-top{display:flex;align-items:flex-start;gap:11px}.event-emoji{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:13px;background:var(--tint,#eeeaff);font-size:20px}.event-info{min-width:0;flex:1}.event-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}.event-date{color:var(--muted);font-size:11px;margin-top:5px}.star{border:0;background:transparent;color:#c5c7d2;font-size:19px;line-height:1;padding:0 2px}.star.on{color:#f0b83c}.countdown{display:flex;align-items:baseline;gap:6px;margin:16px 0 12px}.countdown strong{font-size:27px;letter-spacing:-1px}.countdown span{font-size:12px;font-weight:700;color:#8d91a3}.countdown .today{color:var(--purple)}.bar-meta{display:flex;justify-content:space-between;color:#a0a3b1;font-size:10px;margin-bottom:6px}.track{height:6px;background:#f0f0f5;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#927ef2,#7157e8)}.event-foot{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.tag{background:#f4f4f8;color:#777b8f;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:700}.actions{display:flex;gap:5px}.icon-btn{border:0;background:#f7f7fa;color:#85899a;border-radius:7px;width:28px;height:27px}.icon-btn:hover{background:var(--purple2);color:var(--purple)}.side-panel{padding:21px}.side-title{font-weight:800;font-size:15px;margin-bottom:16px}.next-card{background:linear-gradient(135deg,#7057e8,#937ce9);border-radius:15px;color:white;padding:17px;margin-bottom:22px;position:relative;overflow:hidden}.next-card:after{content:'✦';position:absolute;font-size:80px;right:5px;top:17px;color:#ffffff17}.next-label{font-size:10px;color:#e2dcff;font-weight:700}.next-name{font-size:17px;font-weight:800;margin:9px 0 3px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.next-days{font-size:12px;color:#ede9ff}.next-date{font-size:10px;color:#ded7ff;margin-top:14px}.mini-heading{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin:0 0 12px}.mini-heading span{color:#a0a3b2;font-weight:500}.month{border:1px solid var(--line);border-radius:13px;padding:12px}.month-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;font-size:12px}.month-nav{display:flex;gap:5px}.month-nav button{border:0;background:#f5f4fa;border-radius:6px;color:#787b8e;width:23px;height:23px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week span{font-size:9px;color:#a5a8b5;padding:5px 0}.day{height:27px;display:grid;place-items:center;font-size:10px;color:#6e7287;border-radius:8px;position:relative}.day.today{background:var(--purple);color:white;font-weight:800}.day.marked:not(.today):after{content:'';position:absolute;bottom:2px;width:3px;height:3px;background:#8b77ec;border-radius:50%}.upcoming{margin-top:22px}.up-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f2f2f6}.up-row:last-child{border:0}.up-dot{width:8px;height:8px;background:#9481ef;border-radius:50%;flex:none}.up-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.up-when{color:#9296a7;font-size:10px;white-space:nowrap}.empty{grid-column:1/-1;text-align:center;padding:55px 20px;color:#989bac}.empty-icon{font-size:35px;margin-bottom:12px}.empty strong{display:block;color:#45485d;font-size:14px;margin-bottom:6px}.empty button{margin-top:14px;border:0;color:white;background:var(--purple);padding:10px 14px;border-radius:9px;font-weight:700}.overlay{display:none;position:fixed;inset:0;background:#17172b66;z-index:5;align-items:center;justify-content:center;padding:18px}.overlay.open{display:flex}.modal{background:white;width:min(470px,100%);border-radius:19px;padding:24px;box-shadow:0 25px 90px #13132b44;max-height:92vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:18px}.close{border:0;background:#f3f3f7;border-radius:8px;width:30px;height:30px;font-size:17px;color:#777}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#73778b;font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);padding:11px;border-radius:9px;outline:none;background:white;color:var(--ink)}.field textarea{resize:vertical;min-height:70px}.modal-actions{display:flex;justify-content:space-between;margin-top:20px}.delete-btn{border:0;background:#fff0f0;color:#d65b5b;padding:10px 13px;border-radius:9px;font-size:12px;font-weight:700}.right-actions{display:flex;gap:8px}.cancel-btn{border:1px solid var(--line);background:white;color:#777b8d;padding:10px 13px;border-radius:9px;font-weight:700}.save-btn{border:0;background:var(--purple);color:white;padding:10px 17px;border-radius:9px;font-weight:700}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#25263b;color:white;padding:12px 18px;border-radius:11px;opacity:0;transition:.25s;pointer-events:none;z-index:8;box-shadow:0 8px 22px #25263b33;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{text-align:center;color:#aeb0bc;font-size:10px;margin-top:20px}

<body><div class="shell">
<header class="topbar"><div class="brand"><div class="brand-icon">D</div>오늘의 D-DAY</div><div class="top-right"><div class="today-pill" id="todayPill"></div><button class="export-btn" id="exportBtn" title="등록한 일정 전체를 엑셀 파일로 저장">↓ 엑셀 다운로드</button><button class="export-btn import-btn" id="importBtn" title="엑셀 파일에서 일정 가져오기">↑ 엑셀 업로드</button><input id="importFile" type="file" accept=".xlsx,.xls,.csv" hidden><button class="add-btn" id="addTop">＋ 일정 추가</button></div></header>
<section class="greeting"><div><h1>기다리는 날을 한눈에</h1><p>소중한 순간까지, 하루하루를 기록해 보세요.</p></div></section>
<section class="summary"><div class="stat"><div class="label">전체 일정</div><div class="value" id="totalStat">0</div><div class="sub">등록된 모든 이벤트</div><div class="bubble">▤</div></div><div class="stat"><div class="label">다가오는 일정</div><div class="value" id="upcomingStat">0</div><div class="sub">오늘 이후의 일정</div><div class="bubble">↗</div></div><div class="stat"><div class="label">이번 달 일정</div><div class="value" id="monthStat">0</div><div class="sub">이번 달에 예정된 일정</div><div class="bubble">▦</div></div><div class="stat"><div class="label">즐겨찾기</div><div class="value" id="favStat">0</div><div class="sub">핀으로 모아 둔 일정</div><div class="bubble">★</div></div></section>
<div class="layout"><main class="main-panel"><div class="panel-head"><div class="panel-title">나의 일정 <small id="resultCount">0개</small></div><input class="search" id="search" type="search" placeholder="⌕  일정 검색"></div><div class="toolbar"><div class="tabs" id="tabs"><button class="tab active" data-filter="all">전체</button><button class="tab" data-filter="upcoming">예정</button><button class="tab" data-filter="past">지난 일정</button><button class="tab" data-filter="favorites">즐겨찾기</button></div><select class="sort" id="sort"><option value="date">날짜순</option><option value="name">이름순</option><option value="created">최근 추가순</option></select></div><div class="events" id="events"></div></main>
<aside class="side-panel"><div class="side-title">다가오는 순간</div><div class="next-card" id="nextCard"></div><div class="month"><div class="month-head"><span id="monthTitle"></span><div class="month-nav"><button id="prevMonth" aria-label="이전 달">‹</button><button id="nextMonth" aria-label="다음 달">›</button></div></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="calendarDays"></div></div><div class="upcoming"><div class="mini-heading">다가오는 일정 <span>가까운 순</span></div><div id="upcomingList"></div></div></aside></div><div class="footer">일정은 이 브라우저에 안전하게 저장됩니다 · 다른 기기와 동기화되지 않습니다</div></div>
<div class="overlay" id="overlay"><form class="modal" id="eventForm"><div class="modal-head"><h2 id="modalTitle">새 일정 추가</h2><button type="button" class="close" id="closeModal">×</button></div><input type="hidden" id="eventId"><div class="form-grid"><div class="field full"><label for="name">일정 이름 *</label><input id="name" maxlength="60" required placeholder="예: 여행 출발, 시험일"></div><div class="field"><label for="date">목표 날짜 *</label><input type="date" id="date" required></div><div class="field"><label for="startDate">시작 날짜 (선택)</label><input type="date" id="startDate"></div><div class="field"><label for="category">분류</label><select id="category"><option>개인</option><option>기념일</option><option>업무</option><option>학업</option><option>여행</option><option>건강</option><option>기타</option></select></div><div class="field"><label for="emoji">아이콘</label><select id="emoji"><option value="🎯">🎯 목표</option><option value="🎂">🎂 기념일</option><option value="✈️">✈️ 여행</option><option value="💼">💼 업무</option><option value="📚">📚 학업</option><option value="💖">💖 소중한 날</option><option value="🏃">🏃 건강</option><option value="🎉">🎉 축하</option><option value="🌿">🌿 기타</option></select></div><div class="field full"><label for="note">메모 (선택)</label><textarea id="note" maxlength="240" placeholder="잊지 않을 내용을 적어 두세요"></textarea></div></div><div class="modal-actions"><button type="button" class="delete-btn" id="deleteBtn" hidden>일정 삭제</button><div class="right-actions"><button type="button" class="cancel-btn" id="cancelModal">취소</button><button class="save-btn" type="submit">저장하기</button></div></div></form></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='today-dday-events-v1',today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())},iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,parse=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},diff=(a,b)=>Math.round((a-b)/86400000),fmt=s=>parse(s)?.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'})||'',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let events=[],filter='all',monthCursor=today(),toastTimer;
const $=id=>document.getElementById(id);function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');events=Array.isArray(v)?v:[]}catch{events=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(events))}function delta(e){return diff(parse(e.date),today())}function statusLabel(n){return n>0?`D-${n}`:n<0?`D+${Math.abs(n)}`:'D-Day'}function sorted(){let a=[...events];if(filter==='upcoming')a=a.filter(e=>delta(e)>=0);if(filter==='past')a=a.filter(e=>delta(e)<0);if(filter==='favorites')a=a.filter(e=>e.favorite);const q=$('search').value.trim().toLowerCase();if(q)a=a.filter(e=>(e.name+' '+e.category+' '+(e.note||'')).toLowerCase().includes(q));const s=$('sort').value;if(s==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'ko'));else if(s==='created')a.sort((x,y)=>(y.created||0)-(x.created||0));else a.sort((x,y)=>parse(x.date)-parse(y.date));return a}
function progress(e){const target=parse(e.date),now=today();let start=e.startDate?parse(e.startDate):new Date(target.getFullYear(),target.getMonth(),target.getDate()-30);if(target<=start)return 100;return Math.max(0,Math.min(100,Math.round((diff(now,start)/(diff(target,start)))*100)))}function render(){const now=today(),nUpcoming=events.filter(e=>delta(e)>=0).length; $('todayPill').textContent=now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});$('totalStat').textContent=events.length;$('upcomingStat').textContent=nUpcoming;$('monthStat').textContent=events.filter(e=>{let d=parse(e.date);return d>=now&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).length;$('favStat').textContent=events.filter(e=>e.favorite).length;let arr=sorted();$('resultCount').textContent=`${arr.length}개`;const root=$('events');if(!arr.length){root.innerHTML=`<div class="empty"><div class="empty-icon">${events.length?'🔎':'🗓️'}</div><strong>${events.length?'조건에 맞는 일정이 없어요':'아직 등록된 일정이 없어요'}</strong><span>${events.length?'검색어나 필터를 바꿔 보세요.':'기다리는 날을 추가해 D-DAY를 시작해 보세요.'}</span>${events.length?'': '<br><button id="emptyAdd">＋ 첫 일정 추가</button>'}</div>`;$('emptyAdd')?.addEventListener('click',()=>openModal())}else root.innerHTML=arr.map(e=>{let d=delta(e),p=progress(e),startLabel=e.startDate?`${fmt(e.startDate)}부터`:'목표일 30일 전부터';return `<article class="event"><div class="event-top"><div class="event-emoji" style="--tint:${e.tint||'#eeeaff'}">${esc(e.emoji||'🎯')}</div><div class="event-info"><div class="event-name" title="${esc(e.name)}">${esc(e.name)}</div><div class="event-date">${fmt(e.date)}</div></div><button class="star ${e.favorite?'on':''}" data-star="${e.id}" title="즐겨찾기">★</button></div><div class="countdown"><strong class="${d===0?'today':''}">${statusLabel(d)}</strong><span>${d>0?'남았어요':d<0?'지났어요':'오늘이에요'}</span></div><div class="bar-meta"><span>${esc(e.category||'개인')} · ${startLabel}</span><span>${p}%</span></div><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="event-foot"><span class="tag">${esc(e.category||'개인')}</span><span class="actions"><button class="icon-btn" data-edit="${e.id}" title="수정">✎</button><button class="icon-btn" data-delete="${e.id}" title="삭제">⌫</button></span></div></article>`}).join('');root.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>toggleFav(b.dataset.star));root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(b.dataset.edit));root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeEvent(b.dataset.delete));renderSide()}
function renderSide(){const upcoming=events.filter(e=>delta(e)>=0).sort((a,b)=>parse(a.date)-parse(b.date));const next=upcoming[0];$('nextCard').innerHTML=next?`<div class="next-label">가장 가까운 일정</div><div class="next-name">${esc(next.emoji||'🎯')} ${esc(next.name)}</div><div class="next-days">${delta(next)===0?'오늘이에요!':`D-${delta(next)}일 남았어요`}</div><div class="next-date">${fmt(next.date)}</div>`:`<div class="next-label">가장 가까운 일정</div><div class="next-name">아직 일정이 없어요</div><div class="next-days">새로운 목표를 추가해 보세요</div>`;$('upcomingList').innerHTML=upcoming.slice(0,5).map(e=>`<div class="up-row"><div class="up-dot"></div><div class="up-name">${esc(e.emoji||'🎯')} ${esc(e.name)}</div><div class="up-when">${delta(e)===0?'오늘':`D-${delta(e)}`}</div></div>`).join('')||'<div style="font-size:11px;color:#a0a3b2">예정된 일정이 여기에 표시돼요.</div>';renderCalendar()}
function renderCalendar(){const y=monthCursor.getFullYear(),m=monthCursor.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();$('monthTitle').textContent=first.toLocaleDateString('ko-KR',{year:'numeric',month:'long'});const marks=new Set(events.map(e=>e.date));let html='';for(let i=0;i<first.getDay();i++)html+='<span></span>';for(let d=1;d<=days;d++){let date=iso(new Date(y,m,d));html+=`<span class="day ${date===iso(today())?'today':''} ${marks.has(date)?'marked':''}" title="${marks.has(date)?'일정 있음':''}">${d}</span>`}$('calendarDays').innerHTML=html}
function openModal(id){const e=events.find(x=>x.id===id);$('eventForm').reset();$('eventId').value=e?.id||'';$('modalTitle').textContent=e?'일정 수정':'새 일정 추가';$('deleteBtn').hidden=!e;if(e){$('name').value=e.name;$('date').value=e.date;$('startDate').value=e.startDate||'';$('category').value=e.category||'개인';$('emoji').value=e.emoji||'🎯';$('note').value=e.note||''}else{$('date').value=iso(today());$('category').value='개인'}$('overlay').classList.add('open');setTimeout(()=>$('name').focus(),40)}function closeModal(){$('overlay').classList.remove('open')}function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}function removeEvent(id){const e=events.find(x=>x.id===id);if(!e)return;if(!confirm(`“${e.name}” 일정을 삭제할까요?`))return;events=events.filter(x=>x.id!==id);save();render();closeModal();toast('일정을 삭제했어요.')}function toggleFav(id){const e=events.find(x=>x.id===id);if(e){e.favorite=!e.favorite;save();render();toast(e.favorite?'즐겨찾기에 추가했어요.':'즐겨찾기에서 뺐어요.')}}
function exportExcel(){if(!events.length){toast('다운로드할 일정이 없어요.');return}if(!window.XLSX){toast('엑셀 기능을 불러오지 못했어요. 인터넷 연결 후 다시 시도해 주세요.');return}const rows=[['일정 이름','목표 날짜','시작 날짜','D-DAY','분류','아이콘','메모','즐겨찾기','진행률(%)']];[...events].sort((a,b)=>parse(a.date)-parse(b.date)).forEach(e=>rows.push([e.name,e.date,e.startDate||'',statusLabel(delta(e)),e.category||'개인',e.emoji||'🎯',e.note||'',e.favorite?'예':'아니요',progress(e)]));const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:26},{wch:16},{wch:16},{wch:12},{wch:14},{wch:10},{wch:40},{wch:12},{wch:14}];ws['!autofilter']={ref:`A1:I${rows.length}`};const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'일정목록');XLSX.writeFile(wb,`D-DAY_일정_${iso(today())}.xlsx`);toast(`${events.length}개 일정을 엑셀로 저장했어요.`)}function importDate(v){if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getFullYear(),v.getMonth(),v.getDate()));if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);return d?iso(new Date(d.y,d.m-1,d.d)):''}if(typeof v==='string'){const s=v.trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(parse(s)))return s;const d=new Date(s);return isNaN(d)?'':iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()))}return ''}
async function importExcel(file){if(!file)return;if(!window.XLSX){toast('엑셀 기능을 불러오지 못했어요. 인터넷 연결 후 다시 시도해 주세요.');return}try{const book=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const sheet=book.Sheets[book.SheetNames[0]];if(!sheet)throw new Error('시트를 찾을 수 없습니다.');const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:true});if(!rows.length)throw new Error('시트에 데이터가 없습니다.');const headers=rows[0].map(v=>String(v).trim()),col={};['일정 이름','목표 날짜','시작 날짜','분류','아이콘','메모','즐겨찾기'].forEach(k=>col[k]=headers.indexOf(k));if(col['일정 이름']<0||col['목표 날짜']<0)throw new Error('“일정 이름”과 “목표 날짜” 열을 찾지 못했습니다. 내보낸 D-DAY 엑셀 파일을 선택해 주세요.');const existing=new Set(events.map(e=>`${e.name.trim().toLocaleLowerCase()}|${e.date}`)),incoming=[],bad=0,duplicate=0;for(const row of rows.slice(1)){const name=String(row[col['일정 이름']]||'').trim(),date=importDate(row[col['목표 날짜']]);if(!name&&!row[col['목표 날짜']])continue;if(!name||!date){bad++;continue}const key=`${name.toLocaleLowerCase()}|${date}`;if(existing.has(key)){duplicate++;continue}existing.add(key);const startDate=col['시작 날짜']>=0?importDate(row[col['시작 날짜']]):'';const fav=col['즐겨찾기']>=0?String(row[col['즐겨찾기']]).trim().toLowerCase():'';incoming.push({id:crypto.randomUUID(),name,date,startDate:startDate&&startDate<=date?startDate:'',category:col['분류']>=0&&row[col['분류']]?String(row[col['분류']]):'개인',emoji:col['아이콘']>=0&&row[col['아이콘']]?String(row[col['아이콘']]):'🎯',note:col['메모']>=0?String(row[col['메모']]||''):'',favorite:['예','y','yes','true','1'].includes(fav),created:Date.now()+incoming.length})}if(!incoming.length){toast(duplicate?`새 일정이 없어요. 중복 ${duplicate}개를 건너뛰었어요.`:'가져올 수 있는 일정이 없어요.');return}if(!confirm(`${incoming.length}개 일정을 추가할까요?${duplicate?`\n중복 ${duplicate}개는 건너뜁니다.`:''}${bad?`\n날짜가 없거나 잘못된 ${bad}개 행은 제외됩니다.`:''}`))return;events.push(...incoming);save();render();toast(`${incoming.length}개 일정을 가져왔어요.${duplicate?` 중복 ${duplicate}개 제외`:''}`)}catch(err){toast(err.message||'엑셀 파일을 읽지 못했어요.')}}$('addTop').onclick=()=>openModal();$('exportBtn').onclick=exportExcel;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{importExcel(e.target.files[0]);e.target.value='' };$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};$('deleteBtn').onclick=()=>removeEvent($('eventId').value);$('eventForm').onsubmit=e=>{e.preventDefault();const id=$('eventId').value,old=events.find(x=>x.id===id),date=$('date').value,startDate=$('startDate').value;if(!date){toast('목표 날짜를 입력해 주세요.');return}if(startDate&&startDate>date){toast('시작 날짜는 목표 날짜보다 늦을 수 없어요.');return}const item={id:id||crypto.randomUUID(),name:$('name').value.trim(),date,startDate,category:$('category').value,emoji:$('emoji').value,note:$('note').value.trim(),favorite:old?.favorite||false,created:old?.created||Date.now()};if(!item.name)return;if(old)events=events.map(x=>x.id===id?item:x);else events.push(item);save();closeModal();render();toast(old?'일정을 수정했어요.':'새 일정을 추가했어요.')};$('tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};$('search').oninput=render;$('sort').onchange=render;$('prevMonth').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{monthCursor=new Date(monthCursor.getFullYear(),monthCursor.getMonth()+1,1);renderCalendar()};document.onkeydown=e=>{if(e.key==='Escape')closeModal()};load();render()})();
</script></body></html>
